{% extends 'pizza/base.html' %}

{% block content %}
<div class="container">
    <h2>Управление заказами</h2>

    {% for order in orders %}
    <div class="order-card">
        <h3>Заказ #{{ order.id }}</h3>
        <p>Клиент: {{ order.customer.user.username }}</p>
        <p>Дата: {{ order.created_at|date:"d.m.Y H:i" }}</p>
        <p>Статус: {{ order.get_status_display }}</p>
        
        <form method="post" action="{% url 'pizza:update_order_status' order.id %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Статус:</label>
                <select name="status" class="form-control">
                    {% for status, label in status_choices %}
                    <option value="{{ status }}" {% if order.status == status %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Курьер:</label>
                <select name="courier_id" class="form-control">
                    <option value="">Выберите курьера</option>
                    {% for courier in couriers %}
                    <option value="{{ courier.id }}" {% if order.courier == courier %}selected{% endif %}>
                        {{ courier.user.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Применить</button>
        </form>
    </div>
    {% endfor %}
</div>

<style>
.order-card {
    padding: 20px;
    margin: 15px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.form-group {
    margin: 10px 0;
}

.form-control {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
}
</style>
{% endblock %}
