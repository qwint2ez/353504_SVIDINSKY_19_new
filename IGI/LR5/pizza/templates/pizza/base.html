<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Пиццерия{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'pizza:pizza_list' %}">Главная</a></li>
                <li><a href="{% url 'pizza:pizza_create' %}">Добавить пиццу</a></li>
            </ul>
            <div class="auth-block">
                {% if user.is_authenticated %}
                    Привет, {{ user.username }}!
                    <a href="{% url 'pizza:logout' %}">Выйти</a>
                {% else %}
                    <a href="{% url 'pizza:login' %}">Войти</a>
                    <a href="{% url 'pizza:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Пиццерия</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
