{% extends 'pizza/base.html' %}

{% block content %}
<div class="container">
    <h2>Вход в систему</h2>
    
    <form method="post" class="login-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    
    <p>Нет аккаунта? <a href="{% url 'pizza:register' %}">Зарегистрируйтесь</a></p>
</div>

<style>
.login-form {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
}
</style>
{% endblock %}
