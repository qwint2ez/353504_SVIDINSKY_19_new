{% extends 'pizza/base.html' %}

{% block content %}
<h1>Список пицц</h1>
<a href="{% url 'pizza:pizza_create' %}" class="btn btn-primary">Добавить новую пиццу</a>

<div class="row mt-3">
    {% for pizza in pizzas %}
    <div class="col-md-4 mb-4">
        <div class="card">
            {% if pizza.image %}
            <img src="{{ pizza.image.url }}" class="card-img-top" alt="{{ pizza.name }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ pizza.name }}</h5>
                <p class="card-text">{{ pizza.description|truncatewords:20 }}</p>
                <p class="card-text">Цена: {{ pizza.price }} руб.</p>
                <a href="{% url 'pizza:pizza_detail' pizza.pk %}" class="btn btn-info">Подробнее</a>
                <a href="{% url 'pizza:pizza_update' pizza.pk %}" class="btn btn-warning">Изменить</a>
                <a href="{% url 'pizza:pizza_delete' pizza.pk %}" class="btn btn-danger">Удалить</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
