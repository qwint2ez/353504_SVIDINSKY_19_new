{% extends 'pizza/base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 20px auto; padding: 20px;">
    <h1>Оставить отзыв</h1>

    <form method="post" class="review-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.pizza.id_for_label }}">Выберите пиццу:</label>
            {{ form.pizza }}
        </div>

        <div class="form-group">
            <label>Оценка:</label>
            <div class="rating">
                {{ form.rating }}
            </div>
        </div>

        <div class="form-group">
            <label for="{{ form.text.id_for_label }}">Ваш отзыв:</label>
            {{ form.text }}
        </div>

        {% if form.errors %}
        <div class="errors">
            {{ form.errors }}
        </div>
        {% endif %}

        <button type="submit" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Отправить отзыв
        </button>
    </form>
</div>

<style>
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .rating {
        display: flex;
        gap: 10px;
        margin: 10px 0;
    }
    .errors {
        color: red;
        margin-bottom: 15px;
    }
    select, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
</style>
{% endblock %}
